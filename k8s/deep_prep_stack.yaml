apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepprep-api
  labels:
    app: deepprep-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: deepprep-api
  template:
    metadata:
      labels:
        app: deepprep-api
    spec:
      containers:
      - name: fastapi
        image: deepprep-api:v2.0
        ports:
        - containerPort: 8000
        env:
        - name: FEAST_REDIS_HOST
          value: "redis-online-store"
        - name: KAFKA_BROKER
          value: "kafka-broker:9092"
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: deepprep-api-svc
spec:
  selector:
    app: deepprep-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-online-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-feature-store
  template:
    metadata:
      labels:
        app: redis-feature-store
    spec:
      containers:
      - name: redis
        image: redis:6.2-alpine
        ports:
        - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis-online-store
spec:
  selector:
    app: redis-feature-store
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deepprep-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deepprep-dashboard
  template:
    metadata:
      labels:
        app: deepprep-dashboard
    spec:
      containers:
      - name: streamlit
        image: deepprep-dashboard:v1.0
        ports:
        - containerPort: 8501
        env:
        - name: API_URL
          value: "http://deepprep-api-svc:80"

---
apiVersion: v1
kind: Service
metadata:
  name: deepprep-dashboard-svc
spec:
  selector:
    app: deepprep-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer
