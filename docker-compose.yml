version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: deepprep-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - deepprep-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: deepprep-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - deepprep-net

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: deepprep-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - deepprep-net

  api:
    build: .
    container_name: deepprep-api
    command: uvicorn src.api.router:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - FEAST_REDIS_HOST=redis
      - KAFKA_BROKER=kafka:29092
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - deepprep-net

  dashboard:
    build: .
    container_name: deepprep-dashboard
    command: streamlit run src/monitoring/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - deepprep-net

networks:
  deepprep-net:
    driver: bridge
