name: "Scheduled Retrain & Validation Gate"

on:
  schedule:
    # Weekly, Sunday 02:00 UTC (weekly keeps the commit history clean)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  MODEL_DIR: 'models'
  CHAMPION_PATH: 'models/deep_prep_weights.pth'

jobs:
  retrain:
    name: "Retrain PyTorch Model"
    runs-on: ubuntu-latest
    
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy polars scikit-learn

      - name: "🧠 Retrain Challenger"
        run: |
          python scripts/retrain.py

      - name: "🧪 Validate New Model Against Champion"
        id: validate
        run: |
          python scripts/validate_model.py

      - name: "🚀 Auto-Deploy If Validation Passes"
        if: steps.validate.outputs.deploy == 'true'
        run: |
          echo "✅ New model passed validation gate."
          echo "📦 Promoting new model to Champion..."
          cp models/challenger_model.pt models/deep_prep_weights.pth
          echo "🎉 Champion model updated successfully."

      - name: "💾 Commit Updated Weights"
        if: steps.validate.outputs.deploy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git diff --cached --quiet || git commit -m "chore(model): auto-deploy retrained champion [scheduled retrain]"
          git push
